name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore STT-ApiGateway.slnx

      - name: Build
        run: dotnet build STT-ApiGateway.slnx -c Release --no-restore

      - name: Build Docker image
        run: docker build -f Gateway.Api/Dockerfile -t apigateway:ci .
